[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lovebirds"
version = "0.1.11"
description = "Simulation of observations of biodiversity across gradients."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Drew Terasaki Hart", email = "drew.terasaki.hart@gmail.com" }
]
dependencies = [
  "dill",
  "numpy",
  "pandas",
  "numba",
  "coverage>=7.6.1",
  "nlmpy",
  "scikit-learn>=1.2",
  "dms-variants",
  "scipy",
  "matplotlib",
  "rasterio",
  "xarray",
  "rioxarray",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/erthward/lovebirds"
Repository = "https://github.com/erthward/lovebirds"
Issues = "https://github.com/erthward/lovebirds/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lovebirds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
